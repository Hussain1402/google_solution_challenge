name: relief_hub_ai
description: "ReliefHub AI — Closed-loop local NGO resource management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  firebase_remote_config: ^6.3.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^17.2.2

  # Maps
  google_maps_flutter: ^2.17.0

  # Charts
  fl_chart: ^1.2.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  uuid: ^4.5.3
  cloud_functions: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
