<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ReliefHub AI - Access Portal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#f9f9ff",
                        "on-primary-fixed": "#001b3d",
                        "primary-fixed": "#d6e3ff",
                        "primary-container": "#1a56a0",
                        "secondary-fixed": "#9df0f4",
                        "on-surface": "#191c20",
                        "surface-background": "#F9FAFB",
                        "surface-tint": "#265ea8",
                        "on-secondary-fixed-variant": "#004f52",
                        "on-background": "#191c20",
                        "outline-variant": "#c2c6d3",
                        "secondary": "#00696d",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "surface": "#f9f9ff",
                        "surface-container-highest": "#e2e2e9",
                        "neutral-grey": "#6B7280",
                        "tertiary-fixed": "#ffdcc6",
                        "warning-amber": "#F59E0B",
                        "on-primary-fixed-variant": "#00468c",
                        "surface-container-high": "#e7e8ef",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb786",
                        "inverse-surface": "#2e3036",
                        "on-secondary-fixed": "#002021",
                        "inverse-on-surface": "#f0f0f7",
                        "surface-container": "#ededf4",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#a9c7ff",
                        "on-tertiary": "#ffffff",
                        "urgent-red": "#991B1B",
                        "on-secondary-container": "#037074",
                        "error": "#ba1a1a",
                        "surface-dim": "#d9d9e0",
                        "tertiary-container": "#8a4300",
                        "outline": "#737782",
                        "secondary-fixed-dim": "#81d4d8",
                        "on-surface-variant": "#424751",
                        "primary": "#003e7e",
                        "surface-variant": "#e2e2e9",
                        "safe-green": "#10B981",
                        "surface-container-low": "#f3f3fa",
                        "error-container": "#ffdad6",
                        "on-primary-gradient": "linear-gradient(135deg, #1A56A0 0%, #0D7377 100%)",
                        "secondary-container": "#9df0f4",
                        "surface-bright": "#f9f9ff",
                        "on-tertiary-container": "#ffbf95",
                        "on-tertiary-fixed-variant": "#723600",
                        "primary-fixed-dim": "#a9c7ff",
                        "tertiary": "#673000",
                        "on-primary-container": "#b3cdff",
                        "on-tertiary-fixed": "#311300"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "gutter": "16px",
                        "container-padding-desktop": "24px",
                        "card-gap": "12px",
                        "container-padding-mobile": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "label-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "terminal-code": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "title-md": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["11px", {"lineHeight": "16px", "fontWeight": "500"}],
                        "label-lg": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "terminal-code": ["13px", {"lineHeight": "18px", "fontWeight": "400"}],
                        "title-lg": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "title-md": ["16px", {"lineHeight": "24px", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .gradient-logo {
            background: linear-gradient(135deg, #1A56A0 0%, #0D7377 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .main-gradient-bg {
            background: linear-gradient(135deg, #F9FAFB 0%, #EEF2FF 100%);
        }
    </style>
</head>
<body class="main-gradient-bg min-h-screen flex items-center justify-center font-body-md text-on-background p-4 md:p-8">
<!-- Auth Container -->
<div class="w-full max-w-md bg-white rounded-xl shadow-lg border border-outline-variant overflow-hidden">
<!-- Header / Logo -->
<div class="pt-10 pb-6 px-8 flex flex-col items-center text-center">
<div class="w-16 h-16 rounded-xl flex items-center justify-center mb-4" style="background: linear-gradient(135deg, #1A56A0 0%, #0D7377 100%); shadow: 0 4px 12px rgba(26, 86, 160, 0.2);">
<span class="material-symbols-outlined text-white text-4xl" data-weight="fill">hub</span>
</div>
<h1 class="gradient-logo font-headline-md text-headline-md tracking-tight">ReliefHub AI</h1>
<p class="font-body-md text-on-surface-variant mt-1">Intelligent logistics for humanitarian aid.</p>
</div>
<!-- Form Canvas -->
<div class="px-8 pb-10">
<!-- Tabs (Minimalist Toggle) -->
<div class="flex bg-surface-container-low p-1 rounded-lg mb-8 border border-outline-variant/50">
<button class="flex-1 py-2 text-center font-label-lg text-label-lg rounded-md bg-white shadow-sm text-primary">Login</button>
<button class="flex-1 py-2 text-center font-label-lg text-label-lg text-on-surface-variant hover:text-primary transition-colors">Register</button>
</div>
<!-- Login View -->
<form class="space-y-5">
<!-- Role Selection (Contextual for Register, but shown here as a subtle field) -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="role">Access Role</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-4 py-3 appearance-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-on-surface" id="role">
<option value="donor">Donor</option>
<option value="admin">NGO Admin</option>
<option value="staff">NGO Staff</option>
</select>
<div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none">
<span class="material-symbols-outlined text-outline">expand_more</span>
</div>
</div>
</div>
<!-- Email Input -->
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="email">Organization Email</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-3.5 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-on-surface placeholder:text-outline/60" id="email" placeholder="name@relief-org.org" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-center">
<label class="font-label-lg text-label-lg text-on-surface-variant uppercase" for="password">Security Code</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-3.5 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-12 py-3 focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none font-body-md text-on-surface placeholder:text-outline/60" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 top-3.5 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- CTA Button -->
<div class="pt-4">
<button class="w-full py-4 bg-primary text-on-primary font-title-md text-title-md rounded-xl hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-md" type="submit">
<span>Authorize Access</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</div>
</form>
<!-- Trust Badge -->
<div class="mt-8 pt-8 border-t border-outline-variant flex items-center justify-center gap-6 opacity-60 grayscale group-hover:grayscale-0 transition-all">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">verified_user</span>
<span class="font-label-md text-label-md">SSO Ready</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]">security</span>
<span class="font-label-md text-label-md">ISO 27001</span>
</div>
</div>
</div>
</div>
<!-- Decorative Elements (Bottom Left) -->
<div class="fixed bottom-8 left-8 hidden lg:block max-w-xs">
<div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-outline-variant/30 shadow-xl">
<div class="flex items-center gap-3 mb-4">
<div class="w-2 h-2 rounded-full bg-safe-green animate-pulse"></div>
<span class="font-label-lg text-label-lg text-on-surface-variant">Global Ops Active</span>
</div>
<p class="font-body-md text-on-surface leading-relaxed italic">
                "Scaling compassion with logistical precision. ReliefHub AI now powering 400+ NGO response units worldwide."
            </p>
</div>
</div>
<!-- Right Side Graphic (Background Subtle Pattern) -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary-fixed/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-secondary-fixed/20 rounded-full blur-[100px]"></div>
</div>
</body></html>
